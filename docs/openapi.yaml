          type: string
        trackingUrl:
          type: string
        estimatedDelivery:
          type: string
          format: date-time
    PaymentActionRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
        metadata:
          type: object
          additionalProperties: true
    QRRegenerateRequest:
      type: object
      properties:
        force:
          type: boolean
          default: true
        reason:
          type: string
          default: Admin QR regeneration
    NotificationRetryRequest:
      type: object
      properties:
        reason:
          type: string
        force:
          type: boolean
          default: false
    ShipmentCancelRequest:
      type: object
      properties:
        reason:
          type: string
    MultipartImageRequest:
      type: object
      required:
        - image
      properties:
        image:
          type: string
          format: binary
          description: "Multipart field name: image. Allowed MIME types: image/jpeg, image/png, image/webp, image/gif. Default max size: 25MB unless UPLOAD_MAX_BYTES is configured."
    MultipartDocumentRequest:
      type: object
      required:
        - document
      properties:
        document:
          type: string
          format: binary
          description: "Multipart field name: document. Allowed MIME types: application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document. Default max size: 25MB unless UPLOAD_MAX_BYTES is configured."
  responses:
    BadRequest:
      description: Invalid input or business rule failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            error:
              value:
                success: false
                message: Error message
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Authenticated user does not have the required role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource or route not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Duplicate resource or state conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            duplicate:
              value:
                success: false
                message: Resource already exists
    PayloadTooLarge:
      description: Request body or upload exceeds configured size limits.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            tooLarge:
              value:
                success: false
                message: File too large
    UnsupportedMediaType:
      description: Unsupported upload MIME type or file extension.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            unsupported:
              value:
                success: false
                message: Unsupported file type
    UnprocessableEntity:
      description: Validation passed transport parsing but failed business validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: Rate limit exceeded.
      headers:
        RateLimit:
          schema:
            type: string
          description: Standard rate limit policy header.
        RateLimit-Policy:
          schema:
            type: string
          description: Configured rate-limit policy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            rateLimited:
              value:
                success: false
                message: "Too many requests from this IP, please try again later."
    ServiceUnavailable:
      description: Required runtime dependency is unavailable or not configured.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
