components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
          examples:
            - true
        data:
          type: object
        message:
          type: string
    ApiError:
      type: object
      required:
        - message
      properties:
        success:
          type: boolean
          examples:
            - false
        status:
          type: string
          examples:
            - error
        message:
          type: string
        stack:
          type: string
          description: Development only.
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum:
            - visitor
            - reader
            - author
            - admin
          default: reader
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    OrderCreateRequest:
      type: object
      required:
        - items
        - shippingAddress
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - book
              - quantity
            properties:
              book:
                type: string
                description: Book ObjectId.
              quantity:
                type: integer
                minimum: 1
        shippingAddress:
          type: object
          required:
            - fullName
            - addressLine1
            - city
            - postalCode
            - country
          properties:
            fullName:
              type: string
            addressLine1:
              type: string
            addressLine2:
              type: string
            city:
              type: string
            postalCode:
              type: string
            country:
              type: string
        paymentMethod:
          type: string
          default: UPI
          examples:
            - UPI
    PaymentVerificationRequest:
      type: object
      required:
        - utr
      properties:
        utr:
          type: string
          pattern: "^[A-Z0-9-]{6,64}$"
    StatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
        reason:
          type: string
        description:
          type: string
        location:
          type: string
        occurredAt:
          type: string
          format: date-time
    RejectPaymentRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
        bio:
          type: string
          description: Accepted by controller but currently not persisted in User schema.
        profilePicture:
          type: string
          format: uri
    WishlistRequest:
      type: object
      required:
        - bookId
      properties:
        bookId:
          type: string
    BookCreateRequest:
      type: object
      required:
        - title
        - description
        - category
        - price
      properties:
        title:
          type: string
        description:
          type: string
        author:
          type: string
          description: Optional author ObjectId. Defaults to current admin user when omitted.
        category:
          type: string
          description: Category ObjectId.
        price:
          type: number
        coverImage:
          type: string
          format: uri
        stock:
          type: integer
          minimum: 0
        reservedStock:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
            - draft
            - published
            - archived
          default: draft
        discountPrice:
          type: number
        isBestseller:
          type: boolean
        isFeatured:
          type: boolean
        isNewRelease:
          type: boolean
        isbn:
          type: string
        pages:
          type: integer
          minimum: 1
        format:
          type: string
          enum:
            - hardcover
            - paperback
            - ebook
            - audiobook
          default: paperback
    BookUpdateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        author:
          type: string
        category:
          type: string
        price:
          type: number
        coverImage:
          type: string
          format: uri
        stock:
          type: integer
          minimum: 0
        reservedStock:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
            - draft
            - published
            - archived
        discountPrice:
          type: number
        isBestseller:
          type: boolean
        isFeatured:
          type: boolean
        isNewRelease:
          type: boolean
        isbn:
          type: string
        pages:
          type: integer
          minimum: 1
        format:
          type: string
          enum:
            - hardcover
            - paperback
            - ebook
            - audiobook
    PublishRequestCreate:
      type: object
      required:
        - title
        - genre
        - wordCount
        - packageId
        - fileUrl
      properties:
        title:
          type: string
        genre:
          type: string
        wordCount:
          type: integer
          minimum: 1
        packageId:
          type: string
          description: PublishPackage ObjectId.
        fileUrl:
          type: string
          format: uri
    CourierAssignRequest:
      type: object
      properties:
        provider:
          type: string
          default: manual
        serviceName:
          type: string
          default: Manual Courier
        trackingNumber:
          type: string
        trackingUrl:
          type: string
        estimatedDelivery:
          type: string
          format: date-time
    PaymentActionRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
        metadata:
          type: object
          additionalProperties: true
    QRRegenerateRequest:
      type: object
      properties:
        force:
          type: boolean
          default: true
        reason:
          type: string
          default: Admin QR regeneration
    NotificationRetryRequest:
      type: object
      properties:
        reason:
          type: string
        force:
          type: boolean
          default: false
    ShipmentCancelRequest:
      type: object
      properties:
        reason:
          type: string
    MultipartImageRequest:
      type: object
      properties:
        image:
          type: string
          format: binary
    MultipartDocumentRequest:
      type: object
      properties:
        document:
          type: string
          format: binary
  responses:
    BadRequest:
      description: Invalid input or business rule failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            error:
              value:
                success: false
                message: Error message
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Authenticated user does not have the required role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource or route not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
security:
  - 
    bearerAuth:
[]
x-event-catalog:
  PaymentIntentCreated:
    producer: PaymentService
    entity: Payment
    description: A payment intent was created for an order.
  QRCodeGenerated:
    producer: PaymentService
    entity: Payment
    description: A dynamic QR was generated or regenerated for an active payment intent.
  PaymentSubmitted:
    producer: PaymentService
    entity: Payment
    description: A customer submitted a manual payment reference.
  PaymentVerified:
    producer: PaymentService
    entity: Payment
    description: An authorized actor verified a payment.
  PaymentRejected:
    producer: PaymentService
    entity: Payment
    description: An authorized actor rejected a payment.
  PaymentExpired:
    producer: PaymentService
    entity: Payment
    description: A payment intent expired.
  PaymentCancelled:
    producer: PaymentService
    entity: Payment
    description: A payment intent was cancelled.
  PaymentFailed:
    producer: PaymentService
    entity: Payment
    description: A payment attempt failed.
  OrderCreated:
    producer: OrderPaymentBridgeService
    entity: Order
    description: An order was created with payment and inventory orchestration.
  OrderCancelled:
    producer: OrderPaymentBridgeService
    entity: Order
    description: An order cancellation released runtime resources.
  InventoryReserved:
    producer: InventoryService
    entity: InventoryReservation
    description: Inventory was reserved for checkout.
  InventoryReleased:
    producer: InventoryService
    entity: InventoryReservation
    description: A reservation was released.
  InventoryDeducted:
    producer: InventoryService
    entity: InventoryReservation
    description: Reserved inventory was converted to stock deduction.
  InventoryExpired:
    producer: InventoryService
    entity: InventoryReservation
    description: A reservation expired.
  LedgerCreated:
    producer: "PaymentService|InventoryService"
    entity: Ledger
    description: An immutable ledger entry was written.
  AdminApprovedPayment:
    producer: AdminOperationsService
    entity: Payment
    description: An admin approved a payment through operations tooling.
  AdminRejectedPayment:
    producer: AdminOperationsService
    entity: Payment
    description: An admin rejected a payment through operations tooling.
  AdminCancelledPayment:
    producer: AdminOperationsService
    entity: Payment
    description: An admin cancelled a payment intent.
  AdminExpiredPayment:
    producer: AdminOperationsService
    entity: Payment
    description: An admin expired a payment intent.
  AdminRecreatedQR:
    producer: AdminOperationsService
    entity: Payment
    description: An admin regenerated a payment QR.
  InvoiceGenerated:
    producer: InvoiceService
    entity: Invoice
    description: An official invoice was generated for a verified payment.
  ShipmentCreated:
    producer: ShipmentService
    entity: Shipment
    description: A shipment was created for a paid and invoiced order.
  CourierAssigned:
    producer: ShipmentService
    entity: Shipment
    description: A courier was assigned to a shipment.
  ShipmentDispatched:
    producer: ShipmentService
    entity: Shipment
    description: A shipment entered dispatch or transit.
  ShipmentDelivered:
    producer: ShipmentService
    entity: Shipment
    description: A shipment was delivered.
  ShipmentCancelled:
